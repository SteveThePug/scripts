general {
    lock_cmd = ~/.local/bin/hypr-agent lock; pidof hyprlock || hyprlock
    unlock_cmd = ~/.local/bin/hypr-agent unlock
    before_sleep_cmd = loginctl lock-session
}

# Mark idle time for the activity tracker after 5 minutes without input.
listener {
    timeout = 300
    on-timeout = ~/.local/bin/hypr-agent idle
    on-resume = ~/.local/bin/hypr-agent resume
}
